[package]
name = "openworkers-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Guest SDK for OpenWorkers, API-compatible with Cloudflare's worker crate 0.8"
license = "MIT"
repository = "https://github.com/openworkers/openworkers-worker"
keywords = ["serverless", "wasi", "webassembly", "workers", "openworkers"]
categories = ["wasm", "web-programming"]
exclude = ["examples/"]

[workspace]
members = [".", "macros", "integration"]
exclude = ["examples/hello", "examples/health-shapes"]

[features]
default = []
d1 = []
http = []
# Target the WASI 0.3 fetch-worker-v3 world instead of the 0.2 one: the
# handler export turns async, bodies become real streams and wait_until
# outlives the response. The worker-facing API does not change.
p3 = ["wit-bindgen/async", "wit-bindgen/async-spawn"]

[dependencies]
openworkers-worker-macros = { version = "0.1.0", path = "macros" }
wit-bindgen = { version = "0.60", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
url = "2.4"
http = "1.3"
http-body = "1"
bytes = "1.5"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[lib]
name = "openworkers_worker"
path = "src/lib.rs"
