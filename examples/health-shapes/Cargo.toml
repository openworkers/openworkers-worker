[package]
name = "health-shapes"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { package = "openworkers-worker", path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[workspace]

# Same application, WASI 0.3 world
[features]
p3 = ["worker/p3"]
