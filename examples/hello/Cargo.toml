[package]
name = "hello"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# The rename a workers-rs application makes to move over
[dependencies]
worker = { package = "openworkers-worker", path = "../.." }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }

# Same application, WASI 0.3 world
[features]
p3 = ["worker/p3"]

[profile.release]
opt-level = "s"
lto = true

[workspace]
