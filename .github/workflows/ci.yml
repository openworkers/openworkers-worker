name: ci

on:
  push:
    tags: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # The macros version rarely moves with the sdk, so an already
        # published version is skipped instead of failing the release
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "openworkers-worker-macros").version')
          if curl -sf -A "openworkers-ci" "https://crates.io/api/v1/crates/openworkers-worker-macros/$version" > /dev/null; then
            echo "openworkers-worker-macros $version is already on crates.io"
          else
            cargo publish -p openworkers-worker-macros --locked
          fi

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p openworkers-worker --locked
